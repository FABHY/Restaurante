<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Sabor & Arte</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 40px; }
        h1 { color: #ffb703; text-align: center; margin-bottom: 30px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        /* ABAS DO PAINEL */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .tab-button { background: none; border: none; color: #aaa; font-size: 18px; font-weight: bold; padding: 10px 20px; cursor: pointer; transition: color 0.2s; }
        .tab-button:hover { color: #fff; }
        .tab-button.active-tab { color: #ffb703; border-bottom: 3px solid #ffb703; }

        /* CARDS DE MÉTRICAS */
        .metrics-container { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; }
        .card { background-color: #1e1e1e; border-left: 5px solid #ffb703; border-radius: 8px; padding: 20px; min-width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #aaa; font-size: 14px; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: bold; color: #ffb703; margin: 0; }

        /* CONTROLES E FORMS */
        .controls-container, .form-bloqueio { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px; }
        .date-filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-filter { background-color: #333; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-filter:hover, .btn-filter.active { background-color: #ffb703; color: #121212; }
        .input-date, .select-field { background-color: #333; color: white; border: 1px solid #444; padding: 10px 12px; border-radius: 4px; font-family: inherit; }
        .search-input { width: 100%; padding: 15px; background-color: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; }

        /* TABELA */
        table { width: 100%; border-collapse: collapse; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #ffb703; color: #121212; font-weight: bold; }
        tr:hover { background-color: #2a2a2a; }
        .loading { text-align: center; font-size: 18px; color: #aaa; padding: 20px; }

        /* BADGES */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-pendente { background-color: #ffb703; color: #121212; }
        .badge-confirmada { background-color: #2a9d8f; color: white; }
        .badge-finalizada { background-color: #444; color: #aaa; }
        .badge-bloqueio { background-color: #e63946; color: white; }

        /* BOTÕES */
        .btn-action { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; font-size: 12px; transition: 0.2s; }
        .btn-confirmar { background-color: #2a9d8f; color: white; }
        .btn-finalizar { background-color: #e63946; color: white; }
        .btn-salvar-bloqueio { background-color: #ffb703; color: #121212; font-size: 14px; cursor: pointer; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; align-self: flex-start; }
        .btn-salvar-bloqueio:hover { background-color: #dd9c02; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Painel de Reservas - Sabor & Arte</h1>
        
        <div class="tabs-container">
            <button id="tab-ativas" class="tab-button active-tab" onclick="mudarAba('ativas')">Reservas Ativas</button>
            <button id="tab-historico" class="tab-button" onclick="mudarAba('historico')">Histórico (Finalizadas)</button>
            <button id="tab-bloqueios" class="tab-button" onclick="mudarAba('bloqueios')">🚫 Bloquear Horários</button>
        </div>

        <div id="conteudo-reservas">
            <div class="metrics-container">
                <div class="card"><h3 id="label-card-mesas">Mesas Ativas</h3><p class="value" id="total-reservas">0</p></div>
                <div class="card"><h3 id="label-card-clientes">Clientes Esperados</h3><p class="value" id="total-clientes">0</p></div>
            </div>

            <div id="container-filtros" class="controls-container">
                <div class="date-filters">
                    <span>Filtrar por data:</span>
                    <button class="btn-filter active" id="btn-todas" onclick="filtrarPorPeriodo('todas')">Ver Todas</button>
                    <button class="btn-filter" id="btn-hoje" onclick="filtrarPorPeriodo('hoje')">Hoje</button>
                    <button class="btn-filter" id="btn-amanha" onclick="filtrarPorPeriodo('amanha')">Amanhã</button>
                    <span style="margin-left: 15px;">Escolher dia:</span>
                    <input type="date" id="calendario" class="input-date" onchange="filtrarPorCalendario()">
                </div>
                <div class="search-container"><input type="text" id="campo-busca" class="search-input" placeholder="🔍 Busque por nome, e-mail ou telefone..."></div>
            </div>
            
            <table id="tabela-dados-reservas">
                <thead>
                    <tr><th>Status</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Pessoas</th><th>Data</th><th>Hora</th><th>Observações</th><th id="th-acoes">Ações</th></tr>
                </thead>
                <tbody id="tabela-reservas">
                    <tr><td colspan="9" class="loading">Carregando reservas...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="conteudo-bloqueios" style="display: none;">
            <div class="form-bloqueio">
                <h3>Formulário de Bloqueio de Agenda</h3>
                <div class="date-filters">
                    <label>Escolha a Data: </label>
                    <input type="date" id="data-bloqueio" class="input-date">
                    
                    <label style="margin-left: 15px;">Período/Horário: </label>
                    <select id="hora-bloqueio" class="select-field">
                        <option value="Todos">O Dia Inteiro (Fechado)</option>
                        <option value="18:00">18:00</option>
                        <option value="19:00">19:00</option>
                        <option value="20:00">20:00</option>
                        <option value="21:00">21:00</option>
                        <option value="22:00">22:00</option>
                    </select>
                </div>
                <button class="btn-salvar-bloqueio" onclick="salvarBloqueio()">Aplicar Bloqueio</button>
            </div>

            <table>
                <thead><tr><th>Data Bloqueada</th><th>Horário Afetado</th><th>Ação</th></tr></thead>
                <tbody id="tabela-bloqueios-dados">
                    <tr><td colspan="3" class="loading">Nenhum bloqueio cadastrado.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // --- 🌐 CONFIGURAÇÃO DA URL REMOTA DO RENDER ---
        const API_URL = "https://restaurante-pyg7.onrender.com";

        let todasAsReservas = [];
        let filtroDataAtual = 'todas';
        let abaAtual = 'ativas';

        async function carregarReservas() {
            try {
                const url = abaAtual === 'ativas' ? `${API_URL}/api/reservas` : `${API_URL}/api/reservas/historico`;
                const resposta = await fetch(url);
                todasAsReservas = await resposta.json();
                aplicarTodosOsFiltros();
            } catch (erro) {
                document.getElementById('tabela-reservas').innerHTML = `<tr><td colspan="9" style="text-align:center; color:red;">Erro no servidor.</td></tr>`;
            }
        }

        async function carregarBloqueios() {
            try {
                const resposta = await fetch(`${API_URL}/api/bloqueios`);
                const bloqueios = await resposta.json();
                const tabela = document.getElementById('tabela-bloqueios-dados');
                tabela.innerHTML = '';

                if (bloqueios.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="3" style="text-align:center;">Nenhum bloqueio ativo na agenda.</td></tr>`;
                    return;
                }

                bloqueios.forEach(b => {
                    let dataFormatada = b.data;
                    if(dataFormatada.includes('-')) {
                        const p = dataFormatada.split('-');
                        dataFormatada = `${p[2]}/${p[1]}/${p[0]}`;
                    }

                    const linha = document.createElement('tr');
                    linha.innerHTML = `
                        <td><span class="badge badge-bloqueio">🚫 ${dataFormatada}</span></td>
                        <td><strong>${b.hora === 'Todos' ? 'Dia Todo (Fechado)' : b.hora}</strong></td>
                        <td><button class="btn-action btn-finalizar" onclick="removerBloqueio('${b._id}')">Liberar Data</button></td>
                    `;
                    tabela.appendChild(linha);
                });
            } catch (err) {
                console.error("Erro ao carregar bloqueios:", err);
            }
        }

        function mudarAba(novaAba) {
            abaAtual = novaAba;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById(`tab-${novaAba}`).classList.add('active-tab');

            if (novaAba === 'bloqueios') {
                document.getElementById('conteudo-reservas').style.display = "none";
                document.getElementById('conteudo-bloqueios').style.display = "block";
                carregarBloqueios();
            } else {
                document.getElementById('conteudo-reservas').style.display = "block";
                document.getElementById('conteudo-bloqueios').style.display = "none";
                
                if (novaAba === 'historico') {
                    document.getElementById('label-card-mesas').innerText = "Total Atendido";
                    document.getElementById('label-card-clientes').innerText = "Total de Clientes";
                    document.getElementById('container-filtros').style.display = "none";
                    document.getElementById('th-acoes').style.display = "none";
                } else {
                    document.getElementById('label-card-mesas').innerText = "Mesas Ativas";
                    document.getElementById('label-card-clientes').innerText = "Clientes Esperados";
                    document.getElementById('container-filtros').style.display = "flex";
                    document.getElementById('th-acoes').style.display = "table-cell";
                }
                carregarReservas();
            }
        }

        async function salvarBloqueio() {
            const data = document.getElementById('data-bloqueio').value;
            const hora = document.getElementById('hora-bloqueio').value;

            if(!data) return alert("Por favor, selecione uma data para bloquear!");

            try {
                const resposta = await fetch(`${API_URL}/api/bloqueios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data, hora })
                });
                const res = await resposta.json();
                if(resposta.ok) {
                    alert("🚫 Data bloqueada com sucesso!");
                    document.getElementById('data-bloqueio').value = '';
                    carregarBloqueios();
                } else {
                    alert(res.mensagem || "Erro ao criar bloqueio.");
                }
            } catch (err) {
                alert("Erro ao conectar ao servidor.");
            }
        }

        async function removerBloqueio(id) {
            if(confirm("Deseja reabrir esta data para reservas dos clientes?")) {
                try {
                    await fetch(`${API_URL}/api/bloqueios/${id}`, { method: 'DELETE' });
                    carregarBloqueios();
                } catch (err) {
                    alert("Erro ao remover bloqueio.");
                }
            }
        }

        function aplicarTodosOsFiltros() {
            const textoBusca = document.getElementById('campo-busca').value.toLowerCase();
            const hoje = new Date();
            const amanha = new Date();
            amanha.setDate(hoje.getDate() + 1);
            const dataHojeStr = hoje.toISOString().split('T')[0];
            const dataAmanhaStr = amanha.toISOString().split('T')[0];

            const listaFiltrada = todasAsReservas.filter(reserva => {
                if (abaAtual === 'ativas') {
                    const dataReserva = reserva.data || '';
                    if (filtroDataAtual === 'hoje' && dataReserva !== dataHojeStr) return false;
                    if (filtroDataAtual === 'amanha' && dataReserva !== dataAmanhaStr) return false;
                    if (filtroDataAtual !== 'todas' && filtroDataAtual !== 'hoje' && filtroDataAtual !== 'amanha' && dataReserva !== filtroDataAtual) return false;
                }
                return (reserva.nome || '').toLowerCase().includes(textoBusca) || (reserva.email || '').toLowerCase().includes(textoBusca) || (reserva.telefone || '').toLowerCase().includes(textoBusca);
            });
            renderizarTabela(listaFiltrada);
        }

        function renderizarTabela(listaParaExibir) {
            const tabela = document.getElementById('tabela-reservas');
            tabela.innerHTML = '';
            const cardTotalReservas = document.getElementById('total-reservas');
            const cardTotalClientes = document.getElementById('total-clientes');
            const colunasMax = abaAtual === 'ativas' ? 9 : 8;

            if (listaParaExibir.length === 0) {
                cardTotalReservas.innerText = '0'; cardTotalClientes.innerText = '0';
                tabela.innerHTML = `<tr><td colspan="${colunasMax}" style="text-align:center;">Nenhuma reserva encontrada.</td></tr>`;
                return;
            }

            let somaClientes = 0;
            listaParaExibir.forEach(reserva => {
                if (reserva.pessoas) {
                    let valorPessoas = parseInt(reserva.pessoas.toString().replace(/[^0-9]/g, '')) || 0;
                    somaClientes += valorPessoas;
                }

                let statusClasse = reserva.status === 'Confirmada' ? 'badge-confirmada' : (reserva.status === 'Finalizada' ? 'badge-finalizada' : 'badge-pendente');
                let dataExibicao = reserva.data || '-';
                if (dataExibicao.includes('-')) { const p = dataExibicao.split('-'); dataExibicao = `${p[2]}/${p[1]}/${p[0]}`; }

                const linha = document.createElement('tr');
                let conteudoLinha = `<td><span class="badge ${statusClasse}">${reserva.status || 'Pendente'}</span></td><td><strong>${reserva.nome || '-'}</strong></td><td>${reserva.email || '-'}</td><td>${reserva.telefone || '-'}</td><td>${reserva.pessoas || '-'}</td><td>${dataExibicao}</td><td>${reserva.hora || '-'}</td><td><small>${reserva.obs || 'Sem observações'}</small></td>`;

                if (abaAtual === 'ativas') {
                    conteudoLinha += `<td>${reserva.status === 'Pendente' ? `<button class="btn-action btn-confirmar" onclick="alterarStatus('${reserva._id}', 'Confirmada')">Confirmar</button>` : ''}<button class="btn-action btn-finalizar" onclick="alterarStatus('${reserva._id}', 'Finalizada')">Finalizar</button></td>`;
                }
                linha.innerHTML = conteudoLinha;
                tabela.appendChild(linha);
            });
            cardTotalReservas.innerText = listaParaExibir.length;
            cardTotalClientes.innerText = somaClientes;
        }

        function filtrarPorPeriodo(periodo) { filtroDataAtual = periodo; document.getElementById('calendario').value = ''; document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active')); document.getElementById(`btn-${periodo}`).classList.add('active'); aplicarTodosOsFiltros(); }
        function filtrarPorCalendario() { const data = document.getElementById('calendario').value; if (!data) return; filtroDataAtual = data; document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active')); aplicarTodosOsFiltros(); }
        
        async function alterarStatus(id, novoStatus) {
            if (confirm("Deseja alterar o status desta reserva?")) {
                try {
                    await fetch(`${API_URL}/api/reservas/${id}/status`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ novoStatus })
                    });
                    carregarReservas();
                } catch (erro) {
                    alert("Erro no servidor.");
                }
            }
        }
        document.getElementById('campo-busca').addEventListener('input', aplicarTodosOsFiltros);

        carregarReservas();
    </script>
</body>
</html>
